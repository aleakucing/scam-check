# ==============================================================================
# KrosCheck — Render Blueprint (free tier, no credit card)
# ==============================================================================
# Services:
#   1. kroscheck-api  : Bun + Hono backend (Docker), Postgres via DATABASE_URL
#   2. kroscheck-web  : Svelte static site, built with Vite
#
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repository.
# Render will prompt for DATABASE_URL (Supabase/Neon connection string) and
# VITE_API_BASE_URL (the public URL of the API service).
# ==============================================================================

services:
  - type: web
    name: kroscheck-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: ENVIRONMENT
        value: production

  - type: web
    name: kroscheck-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
